<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑🏽</text></svg>">
<title>TIMO - THE QUEST</title>

<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060d;
    color: #e8ecff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #wrap {
    position: relative;
  }

  canvas {
    background: #0a0c1a;
    border: 4px solid #38bdf8;
    border-radius: 12px;
    image-rendering: pixelated;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.25), 0 10px 40px #000;
    display: block;
  }

  /* Overlay Efeito CRT / Scanlines */
  #title::before {
    content: " ";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 4px;
    z-index: 2;
    pointer-events: none;
    border-radius: 8px;
  }

  #title {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: radial-gradient(circle at 50% 35%, #1e1b4b, #090a0f 85%);
    border-radius: 8px;
    box-sizing: border-box;
    padding: 20px;
    z-index: 1;
  }

  /* Estilo da Imagem do Título */
  .title-logo {
    max-width: 280px;
    height: auto;
    margin-bottom: 15px;
    image-rendering: pixelated;
  }

  /* Menus e Botões */
  #main-menu {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 220px;
    margin-top: 5px;
  }

  #level-select-menu {
    display: none;
    flex-direction: column;
    align-items: center;
  }

  #credits-menu {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 380px;
  }

  .btn {
    padding: 10px 16px;
    background: #1e293b;
    border: 2px solid #5561d3;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 4px 0 #0f172a;
    transition: all 0.1s ease;
    outline: none;
  }

  .btn:hover, .btn.selected {
    background: #334155;
    border-color: #ffd100;
    color: #ffd100;
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #0f172a, 0 0 12px rgba(255, 226, 122, 0.4);
  }

  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #0f172a;
  }

  .btn-back {
    border-color: #f43f5e;
  }

  .btn-back:hover, .btn-back.selected {
    border-color: #fda4af;
    color: #fda4af;
    box-shadow: 0 6px 0 #0f172a, 0 0 12px rgba(244, 63, 94, 0.4);
  }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }

  .level-grid .btn {
    padding: 8px 0;
    width: 75px;
    font-size: 13px;
  }

  .credits-box {
    background: rgba(15, 23, 42, 0.92);
    border: 2px solid #a855f7;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
    color: #e2e8f0;
    font-size: 12px;
    line-height: 1.6;
    max-height: 200px;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
  }

  .credits-box h3 {
    margin: 0 0 8px 0;
    color: #ffe27a;
    font-size: 14px;
    letter-spacing: 1px;
  }

  #hint {
    position: absolute;
    bottom: -28px;
    left: 0;
    right: 0;
    text-align: center;
    color: #64748b;
    font-size: 11px;
    letter-spacing: 1px;
  }

  .blink {
    animation: blinker 1.5s infinite;
  }

  @keyframes blinker {
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="640" height="480"></canvas>
  
  <div id="title">
    <!-- Imagem do Título fornecida -->
    <img src="title-logo.png" alt="TIMO THE QUEST" class="title-logo">
    
    <!-- Menu Principal -->
    <div id="main-menu">
      <button class="btn" id="play">▶ Novo Jogo</button>
      <button class="btn" id="cont" style="display:none; border-color:#4ade80; color:#4ade80;">Continuar</button>
      <button class="btn" id="btn-levels">🎮 Selecionar Nível</button>
      <button class="btn" id="btn-credits" style="border-color:#ff0070; color:#ff0070;">❤️ Context & Credits</button>
    </div>

    <!-- Submenu de Seleção de Níveis -->
    <div id="level-select-menu">
      <div class="level-grid">
        <button class="btn" onclick="startNewAtLevel(1)">Nível 1</button>
        <button class="btn" onclick="startNewAtLevel(2)">Nível 2</button>
        <button class="btn" onclick="startNewAtLevel(3)">Nível 3</button>
        <button class="btn" onclick="startNewAtLevel(4)">Nível 4</button>
        <button class="btn" onclick="startNewAtLevel(5)">Nível 5</button>
        <button class="btn" onclick="startNewAtLevel(6)">Nível 6</button>
        <button class="btn" onclick="startNewAtLevel(7)">Nível 7</button>
        <button class="btn" onclick="startNewAtLevel(8)">Nível 8</button>
        <button class="btn" onclick="startNewAtLevel(9)">Nível 9</button>
        <button class="btn" onclick="startNewAtLevel(10)">Nível 10</button>
        <button class="btn" onclick="startNewAtLevel(11)">Nível 11</button>
        <button class="btn" onclick="startNewAtLevel(12)">Nível 12</button>
      </div>
      <button class="btn btn-back" id="btn-back">◄ Voltar</button>
    </div>

    <!-- Submenu de Créditos -->
    <div id="credits-menu">
      <div class="credits-box">
        <h3>❤️ QUERIDO ARROZINHO ❤️</h3>
        <p>Isto é um joguinho que eu fiz com muito amor para ti.</p>
        <p style="color:#94a3b8; font-style:italic;">I love you forever</p>
        <p style="color:#94a3b8; font-style:italic;">Kiu</p>
      </div>
      <button class="btn btn-back" id="btn-back-credits">◄ Voltar</button>
    </div>
  </div>

  <div id="hint" class="blink">© Kiu · All Rights Reserved · 2026</div>
</div>

<script src="engine.js"></script>
<script src="levels/level1.js"></script>
<script src="levels/level2.js"></script>
<script src="levels/level3.js"></script>
<script src="levels/level4.js"></script>
<script src="levels/level5.js"></script>
<script src="levels/level6.js"></script>
<script src="levels/level7.js"></script>
<script src="levels/level8.js"></script>
<script src="levels/level9.js"></script>
<script src="levels/level10.js"></script>
<script src="levels/level11.js"></script>
<script src="levels/level12.js"></script>

<script>
  // Bloqueio de dispositivos móveis executado imediatamente
  (function checkMobile() {
    const ehTelemovel = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
    if (ehTelemovel) {
      document.body.innerHTML = "<div style='background:#111; color:white; font-family:sans-serif; text-align:center; padding-top:20vh; height:100vh;'><h1>Timo The Quest é um jogo exclusivo para computadores.</h1><p>Por favor, aceda através de um PC, bj.</p><p>❤️ Kiu</p></div>";
      throw new Error("Dispositivo móvel bloqueado.");
    }
  })();

  const canvas = document.getElementById('game');
  const title  = document.getElementById('title');
  const contBtn = document.getElementById('cont');
  const playBtn = document.getElementById('play');
  
  const mainMenu = document.getElementById('main-menu');
  const levelSelectMenu = document.getElementById('level-select-menu');
  const creditsMenu = document.getElementById('credits-menu');

  const btnLevels = document.getElementById('btn-levels');
  const btnCredits = document.getElementById('btn-credits');
  const btnBack = document.getElementById('btn-back');
  const btnBackCredits = document.getElementById('btn-back-credits');

  let menuSelectedIndex = 0;

  function showTitle() {
    title.style.display = 'flex';
    document.getElementById('hint').style.display = 'block';
    switchMenu(levelSelectMenu, mainMenu);
    checkSave();
  }

  function hideTitle() {
    title.style.display = 'none';
    document.getElementById('hint').style.display = 'none';
  }

  function getActiveButtons() {
    let container = null;
    if (mainMenu.style.display !== 'none' && mainMenu.offsetWidth > 0) container = mainMenu;
    else if (levelSelectMenu.style.display !== 'none' && levelSelectMenu.offsetWidth > 0) container = levelSelectMenu;
    else if (creditsMenu.style.display !== 'none' && creditsMenu.offsetWidth > 0) container = creditsMenu;

    if (!container) return [];
    return Array.from(container.querySelectorAll('.btn')).filter(b => b.style.display !== 'none');
  }

  function updateMenuSelection() {
    const btns = getActiveButtons();
    if (btns.length === 0) return;

    if (menuSelectedIndex >= btns.length) menuSelectedIndex = 0;
    if (menuSelectedIndex < 0) menuSelectedIndex = btns.length - 1;

    if (creditsMenu.style.display !== 'none') {
      const idxVoltar = btns.indexOf(btnBackCredits);
      if (idxVoltar !== -1) menuSelectedIndex = idxVoltar;
    }

    btns.forEach((btn, idx) => {
      if (idx === menuSelectedIndex) {
        btn.classList.add('selected');
      } else {
        btn.classList.remove('selected');
      }
    });
  }

  function switchMenu(hideEl, showEl) {
    mainMenu.style.display = 'none';
    levelSelectMenu.style.display = 'none';
    creditsMenu.style.display = 'none';
    
    showEl.style.display = 'flex';
    menuSelectedIndex = 0;
    updateMenuSelection();
  }

  btnLevels.onclick = () => switchMenu(mainMenu, levelSelectMenu);
  btnCredits.onclick = () => switchMenu(mainMenu, creditsMenu);
  btnBack.onclick = () => switchMenu(levelSelectMenu, mainMenu);
  btnBackCredits.onclick = () => switchMenu(creditsMenu, mainMenu);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (title.style.display === 'none') {
        showTitle();
        return;
      }
    }

    if (title.style.display === 'none') return;

    const k = e.key;
    const btns = getActiveButtons();
    if (btns.length === 0) return;

    if (creditsMenu.style.display !== 'none') {
      if (k === ' ' || k === 'Enter' || k === 'Escape') {
        e.preventDefault();
        btnBackCredits.click();
        return;
      }
    }

    if (k === 'ArrowDown' || k === 'ArrowRight' || k.toLowerCase() === 's' || k.toLowerCase() === 'd') {
      e.preventDefault();
      menuSelectedIndex = (menuSelectedIndex + 1) % btns.length;
      updateMenuSelection();
    } else if (k === 'ArrowUp' || k === 'ArrowLeft' || k.toLowerCase() === 'w' || k.toLowerCase() === 'a') {
      e.preventDefault();
      menuSelectedIndex = (menuSelectedIndex - 1 + btns.length) % btns.length;
      updateMenuSelection();
    } else if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      if (btns[menuSelectedIndex]) {
        btns[menuSelectedIndex].click();
      }
    }
  });

  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('mouseenter', () => {
      const btns = getActiveButtons();
      const idx = btns.indexOf(btn);
      if (idx !== -1) {
        menuSelectedIndex = idx;
        updateMenuSelection();
      }
    });
  });

  function checkAndAdvanceIfCompleted() {
    const lvl = Game.state.level;

    if (lvl === 1) {
      const count = (Game.flag('found_mom') ? 1 : 0) + 
                    (Game.flag('found_dad') ? 1 : 0) + 
                    (Game.flag('found_sofia') ? 2 : 0);

      if (count >= 4) {
        Game.startLevel(1);
        if (Game.levels[1] && typeof Game.levels[1].levelComplete === 'function') {
          Game.levels[1].levelComplete();
        }
        return true;
      }
    }

    if (lvl === 2) {
      const count = (Game.flag('l2_found_felix') ? 1 : 0) + 
                    (Game.flag('l2_found_pinho') ? 1 : 0);

      if (count >= 2) {
        Game.startLevel(2);
        if (Game.levels[2] && typeof Game.levels[2].friendsUnlocked === 'function') {
          Game.levels[2].friendsUnlocked();
        }
        return true;
      }
    }

    return false;
  }

  function checkSave() {
    try {
      const s = JSON.parse(localStorage.getItem('tomas-quest') || 'null');
      if (s && (s.level > 1 || (s.flags && Object.keys(s.flags).length > 0))) {
        contBtn.style.display = 'block';
      } else {
        contBtn.style.display = 'none';
      }
    } catch(e) {
      contBtn.style.display = 'none';
    }
    menuSelectedIndex = 0;
    updateMenuSelection();
  }

  playBtn.onclick = () => {
    hideTitle();
    Game.init(canvas);
    Game.reset();
  };

  contBtn.onclick = () => {
    hideTitle();
    Game.init(canvas);
    
    const savedLevel = Game.state.level || 1;
    Game.startLevel(savedLevel);

    checkAndAdvanceIfCompleted();
  };

  function startNewAtLevel(levelNum) {
    hideTitle();
    Game.init(canvas);
    Game.state.flags = {};
    Game.state.level = levelNum;
    Game.save();
    Game.startLevel(levelNum);
    checkAndAdvanceIfCompleted();
  }

  checkSave();
</script>
</body>
</html>
